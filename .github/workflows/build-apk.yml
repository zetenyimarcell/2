name: Nova APK Gyartas

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with: {java-version: '17', distribution: 'temurin'}
    - name: SHA-1 KINYERES (Ezt kell majd bemásolnod a Firebase-be)
      run: |
        echo "A KULCSOD ITT LESZ A KÖVETKEZŐ SORBAN:"
        keytool -list -v -keystore app/nova-release.keystore -alias nova-key -storepass NovaZene2026!
    - name: APK epitese
      env:
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      run: gradle :app:assembleDebug
    - uses: actions/upload-artifact@v4
      with: {name: Nova-Zene-APK, path: app/build/outputs/apk/debug/app-debug.apk}
