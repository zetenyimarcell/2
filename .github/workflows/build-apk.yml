name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build and Upload APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Allando keystore visszaallitasa a Secret-bol
        run: |
          mkdir -p app
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/nova-release.keystore || true

      - name: APK építése
        run: |
          GW=$(find . -maxdepth 5 -type f -name gradlew | head -n1 || true)
          if [ -n "$GW" ]; then
            echo "gradlew megtalalva itt: $GW"
            GW_DIR=$(dirname "$GW")
            chmod +x "$GW"
            cd "$GW_DIR"
            ./gradlew assembleDebug --no-daemon
          else
            echo "Nincs gradlew, rendszer-gradle használata..."
            gradle assembleDebug --no-daemon
          fi

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Hangfolyam-App-Debug
          path: '**/*.apk'
