name: Nova APK Gyartas
on:
  push:
    branches: [ "main", "master" ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Kod lekerese
      uses: actions/checkout@v4
    - name: Java JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    - name: Gradle beallitasa
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.7'
    - name: Allando keystore visszaallitasa
      run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/nova-release.keystore
    - name: APK epitese (alairva az allando kulccsal)
      env:
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      run: gradle :app:assembleDebug
    - name: Letoltes letrehozasa
      uses: actions/upload-artifact@v4
      with:
        name: Nova-Zene-APK
        path: app/build/outputs/apk/debug/app-debug.apk
