name: Build Android APK

# Mikor induljon el az építés?
on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch: # Ez a sor teszi lehetővé, hogy kézzel is el tudd indítani a GitHub felületén (Actions fülön)

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      # 1. Kód letöltése a virtuális gépre
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Java környezet beállítása
      - name: Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Gradle környezet automatikus letöltése és beállítása
     # 3. Gradle környezet beállítása (stabil 8.5-ös verzióval az AGP 8.2.0-hoz)
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      # 4. Keystore fájl visszaállítása a Secrets-ből
      - name: Allando keystore visszaallitasa a Secret-bol
        run: |
          mkdir -p app
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/nova-release.keystore
          ls -la app/nova-release.keystore || true

      # 5. SHA-1 kulcs kiírása
      - name: SHA-1 kiirasa (ellenorzeshez)
        run: |
          echo "A KULCSOD ITT LESZ A KOVETKEZO SORBAN:"
          keytool -list -v -keystore app/nova-release.keystore -alias nova-key -storepass "${{ secrets.KEYSTORE_PASSWORD }}" | grep "SHA1:" || true

      # 6. APK építése (ha van gradlew azt futtatja, ha nincs, a telepített gradle-t használja)
      - name: APK építése
        run: |
          set -e
          GW=$(find . -maxdepth 5 -type f -name gradlew | head -n1 || true)
          if [ -n "$GW" ]; then
            echo "gradlew found at: $GW"
            GW_DIR=$(dirname "$GW")
            chmod +x "$GW"
            (cd "$GW_DIR" && ./gradlew :app:assembleDebug --no-daemon --stacktrace --info) 2>&1 | tee build.log
          else
            echo "No gradlew found. Using setup-gradle runner."
            gradle :app:assembleDebug --no-daemon --stacktrace --info 2>&1 | tee build.log
          fi

      # 7. Mappák kilistázása hibakereséshez
      - name: Show build outputs (debug)
        if: always()
        run: |
          echo "Working directory: $(pwd)"
          echo "Repository root listing"
          ls -la || true
          echo "Listing app directory"
          ls -la app || true
          echo "Listing all build/outputs (recursive)"
          ls -R **/build/outputs || true
          echo "Find gradlew files"
          find . -type f -name "gradlew" -print || true
          echo "Find settings.gradle files"
          find . -type f -name "settings.gradle*" -print || true
          echo "Find any .apk or .aab files"
          find . -type f \( -name "*.apk" -o -name "*.aab" \) -print || true

      # 8. Elkészült APK(k) feltöltése a GitHub Actions felületre
      - name: Upload APK artifacts (robust globs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-apks
          path: |
            app/build/outputs/**/*.apk
            **/app/build/outputs/**/*.apk
            **/build/outputs/**/*.apk
            app/build/outputs/**/*.aab
            **/build/outputs/**/*.aab
            **/build/outputs/**/*

      # 9. Log fájl feltöltése
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
