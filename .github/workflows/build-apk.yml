name: Nova APK Gyartas
on:
  push:
    branches: ["main", "master"]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kod lekerese
        uses: actions/checkout@v4

      - name: Java JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make Gradle wrapper executable
        run: |
          chmod +x ./gradlew || true

      - name: Allando keystore visszaallitasa a Secret-bol
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/nova-release.keystore
          ls -la app/nova-release.keystore

      - name: SHA-1 kiirasa (ellenorzeshez)
        run: |
          echo "A KULCSOD ITT LESZ A KOVETKEZO SORBAN:"
          keytool -list -v -keystore app/nova-release.keystore -alias nova-key -storepass "${{ secrets.KEYSTORE_PASSWORD }}" | grep "SHA1:"

      - name: APK epitese (Gradle wrapper)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          ./gradlew :app:assembleDebug --no-daemon --stacktrace --info 2>&1 | tee build.log

      - name: Show build outputs (debug)
        run: |
          echo "Listing app/build directory"
          ls -la app/build || true
          echo "Listing apk outputs"
          ls -R app/build/outputs || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-apks
          path: app/build/outputs/**/*.apk

      - name: Upload build log
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
